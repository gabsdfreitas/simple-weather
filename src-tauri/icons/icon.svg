<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2874a6" />
      <stop offset="40%" stop-color="#5dade2" />
      <stop offset="100%" stop-color="#b8e4f7" />
    </linearGradient>

    <linearGradient id="glareGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="sunGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fffde7" />
      <stop offset="55%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#ff8800" />
    </radialGradient>

    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cloudShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#skyGradient)" />
  
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="none" stroke="#000000" stroke-opacity="0.15" stroke-width="8" />
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4" />

  <circle cx="340" cy="190" r="85" fill="url(#sunGradient)" filter="url(#sunGlow)" />

  <g filter="url(#cloudShadow)">
    <path d="M 160 370 
             L 360 370 
             A 65 65 0 0 0 360 240 
             A 90 90 0 0 0 190 200 
             A 60 60 0 0 0 100 305 
             A 65 65 0 0 0 160 370 Z" 
          fill="url(#glassGradient)" 
          stroke="url(#glassBorder)" 
          stroke-width="6" 
          stroke-linejoin="round" />
  </g>

  <path d="M 180 215 A 80 80 0 0 1 340 240" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="5" stroke-linecap="round" />
  <path d="M 110 300 A 55 55 0 0 1 170 230" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="4" stroke-linecap="round" />

  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#glareGradient)" pointer-events="none" />
</svg>
